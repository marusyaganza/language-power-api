<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="A wheel">
  <title>wheel</title>
  <!-- tire and rim -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#333" stroke-width="16"/>
  <circle cx="100" cy="100" r="74" fill="none" stroke="#8a8a8a" stroke-width="6"/>
  <!-- spokes, every 30 degrees -->
  <g stroke="#8a8a8a" stroke-width="4" stroke-linecap="round">
    <line x1="100" y1="28" x2="100" y2="172"/>
    <line x1="28" y1="100" x2="172" y2="100"/>
    <line x1="64" y1="37.6" x2="136" y2="162.4"/>
    <line x1="136" y1="37.6" x2="64" y2="162.4"/>
    <line x1="37.6" y1="64" x2="162.4" y2="136"/>
    <line x1="37.6" y1="136" x2="162.4" y2="64"/>
  </g>
  <!-- hub -->
  <circle cx="100" cy="100" r="16" fill="#555"/>
  <circle cx="100" cy="100" r="6" fill="#ccc"/>
</svg>
