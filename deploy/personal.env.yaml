# Non-secret settings of the personal deployment, applied on every deploy
# (gcloud run deploy --env-vars-file). Secrets are in Secret Manager instead.
# Every value is quoted: Cloud Run needs strings, and YAML would turn false
# into a boolean. This file replaces all env vars on each deploy, so a setting
# changed with `gcloud run services update` must also be changed here.
USE_MOCKS: "False"
SIGNUP_ENABLED: "false"
COOKIE_SECURE: "true"
DOCS_ENABLED: "false"
CORS_ORIGINS: "[]"
# Generating a word's audio (personal only: the demo refuses to start with it).
# Uploads go to this bucket; the runtime service account may only create files.
AUDIO_ENGINES: '["google"]'
MEDIA_BUCKET: "py-lp-512416-media"
