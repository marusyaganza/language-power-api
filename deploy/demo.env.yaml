# Non-secret settings of the public demo, applied on every deploy
# (gcloud run deploy --env-vars-file). Secrets are in the demo project's Secret
# Manager instead. Every value is quoted: Cloud Run needs strings, and YAML
# would turn false into a boolean. This file replaces all env vars on each
# deploy, so a setting changed with `gcloud run services update` must also be
# changed here.
USE_MOCKS: "false"
SIGNUP_ENABLED: "true"
COOKIE_SECURE: "true"
DOCS_ENABLED: "true"
# Netlify forwards /api/* here without the /api; /docs needs to know it.
ROOT_PATH: "/api"
CORS_ORIGINS: "[]"
# Demo accounts live 24 hours, so no session needs to outlive one.
SESSION_TTL_SECONDS: "86400"
SENTRY_ENVIRONMENT: "demo"
# Limits for strangers on Merriam-Webster's free plan (1,000 queries a day per
# dictionary): 50 accounts × 10 searches stays under the daily 800.
SEARCHES_PER_LANGUAGE: "10"
DAILY_SEARCHES_PER_LANGUAGE: "800"
DAILY_SIGNUP_LIMIT: "50"
ACCOUNT_TTL_HOURS: "24"
MAX_WORDS_PER_USER: "100"
