# Deploy the API to Cloud Run. Started by hand: Actions → Deploy → Run workflow,
# choosing the branch and the target. See notes for the one-time setup.
#
# Each target has its own Google Cloud project. Its identifiers live in
# repository variables named <PREFIX>_..., e.g. PERSONAL_GCP_PROJECT_ID, and its
# non-secret settings in deploy/<target>.env.yaml. Nothing here is secret: Google
# trusts this workflow through Workload Identity Federation, not a stored key.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment to update
        type: choice
        options:
          - personal
        required: true

permissions:
  contents: read

concurrency:
  # One deploy per target at a time; a second one waits instead of racing.
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write  # lets the job ask GitHub for the token Google exchanges

    env:
      TARGET: ${{ inputs.target }}
      # Add a line per target here when one is added to `options` above.
      GCP_PROJECT_ID: ${{ inputs.target == 'personal' && vars.PERSONAL_GCP_PROJECT_ID || '' }}
      GCP_REGION: ${{ inputs.target == 'personal' && vars.PERSONAL_GCP_REGION || '' }}
      GCP_WIF_PROVIDER: ${{ inputs.target == 'personal' && vars.PERSONAL_GCP_WIF_PROVIDER || '' }}
      GCP_DEPLOYER_SA: ${{ inputs.target == 'personal' && vars.PERSONAL_GCP_DEPLOYER_SA || '' }}
      GCP_RUNTIME_SA: ${{ inputs.target == 'personal' && vars.PERSONAL_GCP_RUNTIME_SA || '' }}
      SERVICE_NAME: ${{ inputs.target == 'personal' && vars.PERSONAL_SERVICE_NAME || '' }}
      ARTIFACT_REPOSITORY: ${{ inputs.target == 'personal' && vars.PERSONAL_ARTIFACT_REPOSITORY || '' }}

    steps:
      - name: Check the target's variables are set
        run: |
          missing=""
          for name in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_DEPLOYER_SA GCP_RUNTIME_SA SERVICE_NAME ARTIFACT_REPOSITORY; do
            [ -n "${!name}" ] || missing="$missing ${TARGET^^}_$name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing"
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push the image
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$SERVICE_NAME:$GITHUB_SHA"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      # Deploys the exact image just built. Cloud Run starts the new revision
      # (the entrypoint runs the migrations) and only moves traffic to it once
      # it is healthy; if it fails to start, the old revision keeps serving.
      # Public access (allUsers may invoke) was granted once by hand and stays.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --service-account "$GCP_RUNTIME_SA" \
            --min-instances 0 \
            --max-instances 1 \
            --memory 512Mi \
            --cpu 1 \
            --cpu-boost \
            --timeout 60 \
            --env-vars-file "deploy/$TARGET.env.yaml" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,ENGLISH_API_KEY=ENGLISH_API_KEY:latest,SPANISH_API_KEY=SPANISH_API_KEY:latest" \
            --labels "commit=${GITHUB_SHA::12}" \
            --quiet

      # /auth/config needs no login. Switch to /health once it exists (Phase 6,
      # item 7): with the signed proxy, /auth/config will reject calls that
      # don't come through Netlify.
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "$SERVICE_NAME" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')
          curl --fail --silent --show-error --retry 3 --retry-delay 5 "$URL/auth/config"
          echo
          echo "### Deployed \`${GITHUB_SHA::12}\` to $TARGET" >> "$GITHUB_STEP_SUMMARY"
