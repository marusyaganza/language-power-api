# Lint, then unit and API tests against real Postgres and Redis containers.
# Runs on every push and pull request, and as the first job of deploy.yml.
name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch cancels the older run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Same users and versions as docker-compose.yml, which is what
      # tests/conftest.py expects. The tests create language_app_test themselves.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: language_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Settings in pyproject.toml. Fails on lint errors or unformatted code.
      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # tests/conftest.py sets every setting itself (mock dictionaries, the test
      # database, Redis database 15), so no .env or secrets are needed here.
      - name: Run tests
        run: python -m pytest -q
